<body>

      <input id="searchInput" autocomplete="off" placeholder="Search manager, team, name or chapter">

  <div id="toast" class="toast" role="status"></div>

  <script src="assets/app.2359d74ca7.js"></script>
  <script>
(() => {
'use strict';
const state={manifest:null,data:null,config:null,seeding:[],seedMap:new Map(),ready:false,busy:false};
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const nfmt=n=>Number(n||0).toLocaleString('en-MY');
function hashString(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
async function json(url){const r=await fetch(`${url}?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(url);return r.json()}
async function load(){
  try{
    const m=await json('data/manifest.json');const d=await json(m.snapshot);state.manifest=m;state.config={qualification_gw:2,qualifiers:768,pot_size:192,tie_seed:'AFCL-2026-27-SEEDING-TIE-V1'};state.data=d;build();state.ready=true;enhance();
  }catch(e){console.debug('AFCL profile integration unavailable',e)}
}
function build(){
  const qgw=Number(state.config.qualification_gw||2),tieSeed=state.config.tie_seed||'AFCL-TIE-2026-27';
  const rows=(state.data.individual||[]).map(base=>{const hs=(state.data.histories?.[base.id]||[]).map(Number),gw2=Number(hs[qgw-1]||0),total=hs.slice(0,qgw).reduce((s,x)=>s+x,0);return {...base,gw2,total,tie:hashString(`${tieSeed}|${base.id}`)}}).sort((a,b)=>b.gw2-a.gw2||b.total-a.total||a.tie-b.tie||String(a.team_name).localeCompare(String(b.team_name)));
  rows.forEach((r,i)=>{r.seed=i+1;r.qualified=i<Number(state.config.qualifiers||768);r.pot=r.qualified?Math.floor(i/Number(state.config.pot_size||192))+1:null});state.seeding=rows;state.seedMap=new Map(rows.map(x=>[String(x.id),x]));
}
function enhance(){
  if(!state.ready||state.busy)return;state.busy=true;
  requestAnimationFrame(()=>{try{const parts=(location.hash||'').replace(/^#\/?/,'').split('/').filter(Boolean);if(parts[0]==='manager')addManagerCard(decodeURIComponent(parts[1]||''));if(parts[0]==='more')addRulesCard()}finally{state.busy=false}});
}
function addManagerCard(id){
  const app=document.getElementById('app');if(!app||document.getElementById('afclManagerCard'))return;const r=state.seedMap.get(String(id));if(!r)return;
  const provisional=String(state.manifest.status||'').toUpperCase()!=='FINAL';const el=document.createElement('section');el.className='section';el.id='afclManagerCard';
  el.innerHTML=`<div class="section-head"><div><h2>ANSARA Fantasy Champions League</h2><span class="subline">${provisional?'Provisional GW2 qualification & seeding':'Official GW2 qualification & seeding'}</span></div><a href="afcl.html#/manager/${encodeURIComponent(r.id)}">Open AFCL</a></div><div class="profile-kpis" style="padding:0 14px 14px"><div><span>AFCL Status</span><strong style="font-size:14px;color:${r.qualified?'#15803d':'#b91c1c'}">${r.qualified?'Qualified':'Did Not Qualify'}</strong></div><div><span>GW2 Seed</span><strong>#${r.seed}</strong></div><div><span>GW2 Points</span><strong>${nfmt(r.gw2)}</strong></div><div><span>Pot</span><strong>${r.pot?`P${r.pot}`:'—'}</strong></div></div>${provisional?'<div class="notice" style="margin:0 14px 14px">AFCL position is provisional until FPL confirms GW2 scores. Seed, qualification status and pot may still change.</div>':''}`;
  app.appendChild(el);
}
function addRulesCard(){
  if(document.getElementById('afclRulesMoreCard'))return;const grid=document.querySelector('#app .more-grid'),app=document.getElementById('app');if(!app)return;const a=document.createElement('a');a.id='afclRulesMoreCard';a.href='afcl.html#/rules';a.className='more-card';a.innerHTML='<span>📘</span>Rules & FAQ';if(grid)grid.appendChild(a);else app.appendChild(a);
}
const observer=new MutationObserver(()=>enhance());observer.observe(document.getElementById('app'),{childList:true,subtree:true});window.addEventListener('hashchange',enhance);load();
})();

  </script>
  <script>
    (() => {
      let lastSeenBuildId = null;
      let lastSeenGw = null;
      let checking = false;
      async function checkDashboardUpdate() {
        if (checking || document.hidden) return;
        checking = true;
        try {
          const response = await fetch(`data/manifest.json?v=${Date.now()}`, { cache: "no-store" });
          if (!response.ok) return;
          const latest = await response.json();
          const latestGw = Number(latest.gw || 0);
          const selector = document.getElementById("gwSelect");
          const availableGws = selector ? Array.from(selector.options).map(option => Number(option.value || 0)) : [];
          const loadedMaxGw = availableGws.length ? Math.max(...availableGws) : 0;
          if (loadedMaxGw && latestGw > loadedMaxGw) { location.reload(); return; }
          if (lastSeenBuildId && latest.build_id && latest.build_id !== lastSeenBuildId && latestGw === lastSeenGw) {
            document.getElementById("refreshBtn")?.click();
          }
          lastSeenBuildId = latest.build_id || lastSeenBuildId;
          lastSeenGw = latestGw || lastSeenGw;
        } catch (error) {
          console.debug("ANSARA FPL update check skipped:", error);
        } finally { checking = false; }
      }
      setTimeout(checkDashboardUpdate, 5000);
      setInterval(checkDashboardUpdate, 120000);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) checkDashboardUpdate(); });
      window.addEventListener("focus", checkDashboardUpdate);
    })();
  </script>
  <script type="module" src="assets/firebase-live.js?v=2"></script>
</body>
