<body>

  <div class="app-shell">

    <header class="topbar">

      <a
        class="brand"
        href="#/home"
        aria-label="ANSARA FPL home"
      >

        <img
          src="assets/ansara-fpl-logo.134d22f3bb.png"
          alt="ANSARA FPL"
          class="brand-logo"
        >

        <div>
          <strong>ANSARA FPL</strong>
          <span id="seasonLabel">2026/27</span>
        </div>

      </a>

      <div class="top-actions">

        <span
          class="status-pill"
          id="statusPill"
        >
          <i></i>
          <span>Loading</span>
        </span>

        <button
          class="icon-btn"
          id="refreshBtn"
          type="button"
          aria-label="Refresh"
        >
          ↻
        </button>

      </div>

    </header>


    <section class="controlbar">

      <button
        class="search-trigger"
        id="searchTrigger"
        type="button"
      >
        ⌕
        <span>
          Search manager, team or chapter
        </span>
      </button>

      <label class="gw-control">
        GW
        <select
          id="gwSelect"
          aria-label="Gameweek"
        ></select>
      </label>

    </section>


    <main
      id="app"
      aria-live="polite"
    >

      <div class="loading">

        <div class="spinner"></div>

        <p>
          Loading ANSARA FPL…
        </p>

      </div>

    </main>


    <footer class="footer">

      <strong>
        ANSARA FPL
      </strong>

      <span id="updatedLabel"></span>

      <span>
        Developed by @mrsyafiqzamri
      </span>

    </footer>


    <nav
      class="bottom-nav"
      aria-label="Primary navigation"
    >

      <a
        href="#/home"
        data-nav="home"
      >
        <span>⌂</span>
        <small>Home</small>
      </a>

      <a
        href="#/individual"
        data-nav="individual"
      >
        <span>≡</span>
        <small>Rank</small>
      </a>

      <a
        href="#/groups"
        data-nav="groups"
      >
        <span>◈</span>
        <small>Group</small>
      </a>

      <a
        href="#/chapters"
        data-nav="chapters"
      >
        <span>⌗</span>
        <small>Chapter</small>
      </a>

      <a
        href="#/more"
        data-nav="more"
      >
        <span>•••</span>
        <small>More</small>
      </a>

    </nav>

  </div>


  <dialog
    id="searchDialog"
    class="search-dialog"
  >

    <form
      method="dialog"
      class="search-head"
    >

      <input
        id="searchInput"
        autocomplete="off"
        placeholder="Search manager, team, name or chapter"
      >

      <button aria-label="Close">
        ×
      </button>

    </form>

    <div
      id="searchResults"
      class="search-results"
    ></div>

  </dialog>


  <div
    id="toast"
    class="toast"
    role="status"
  ></div>


  <script src="assets/app.2359d74ca7.js"></script>

  <script>
    (() => {
      let lastSeenBuildId = null;
      let lastSeenGw = null;
      let checking = false;

      async function checkDashboardUpdate() {
        if (checking || document.hidden) return;
        checking = true;

        try {
          const response = await fetch(`data/manifest.json?v=${Date.now()}`, {
            cache: "no-store"
          });
          if (!response.ok) return;

          const latest = await response.json();
          const latestGw = Number(latest.gw || 0);

          const selector = document.getElementById("gwSelect");
          const availableGws = selector
            ? Array.from(selector.options).map(option => Number(option.value || 0))
            : [];
          const loadedMaxGw = availableGws.length ? Math.max(...availableGws) : 0;

          // A genuinely new gameweek has appeared. Reload so the app's normal
          // initial-load logic automatically selects the newest GW.
          if (loadedMaxGw && latestGw > loadedMaxGw) {
            location.reload();
            return;
          }

          // Same gameweek, newer engine build: refresh ranking data while
          // preserving whichever GW (including an archive GW) the user selected.
          if (
            lastSeenBuildId &&
            latest.build_id &&
            latest.build_id !== lastSeenBuildId &&
            latestGw === lastSeenGw
          ) {
            document.getElementById("refreshBtn")?.click();
          }

          lastSeenBuildId = latest.build_id || lastSeenBuildId;
          lastSeenGw = latestGw || lastSeenGw;
        } catch (error) {
          console.debug("ANSARA FPL update check skipped:", error);
        } finally {
          checking = false;
        }
      }

      // Establish the current build after the app has had time to initialise.
      setTimeout(checkDashboardUpdate, 5000);

      // Tiny manifest-only check; this does not trigger GitHub Actions.
      setInterval(checkDashboardUpdate, 120000);

      // Catch up immediately when a user returns to an old Safari/browser tab.
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) checkDashboardUpdate();
      });
      window.addEventListener("focus", checkDashboardUpdate);
    })();
  </script>
  <script type="module">
(async () => {
  try {
    const response = await fetch(`data/manifest.json?v=${Date.now()}`, {
      cache: "no-store"
    });

    const manifest = await response.json();
    const buildId = manifest.build_id || Date.now();

    await import(`./assets/firebase-live.js?v=${encodeURIComponent(buildId)}`);
  } catch (error) {
    console.error("ANSARA FPL UI module load failed:", error);
    await import(`./assets/firebase-live.js?v=${Date.now()}`);
  }
})();
</script>
</body>
</html>
